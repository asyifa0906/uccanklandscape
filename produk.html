<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produk - UCCANK'S LANDSCAPE</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-secondary py-3 shadow-sm">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center text-white"
               href="index.html">

                <img src="gambar/logo.png"
                     alt="Logo UCCANK'S LANDSCAPE"
                     width="50"
                     height="50"
                     class="me-3">

                <span class="fs-4 fw-bold text-uppercase">
                    UCCANK'S LANDSCAPE
                </span>

            </a>

            <!-- Tombol Menu Mobile -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuNavbar"
                    aria-controls="menuNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Menu Navbar -->
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold"
                           href="index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold"
                           href="layanan.html">
                            Layanan
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active text-white fw-semibold"
                           aria-current="page"
                           href="produk.html">
                            Produk
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold"
                           href="kontak.html">
                            Kontak
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>


    <!-- HALAMAN PRODUK -->
    <section class="bg-light min-vh-100 py-4">
        <div class="container">

            <!-- Judul -->
            <div class="text-center mb-4">

                <h1 class="display-5 fw-bold">
                    Produk
                </h1>

                <p class="text-secondary mb-0">
                    Pilih kategori produk
                </p>

            </div>

            <!-- KATEGORI -->
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">

                    <!-- RUMPUT -->
                    <div class="card shadow-sm border text-center mb-3">
                        <div class="card-body p-3">

                            <h2 class="fs-3 fw-bold mb-3">
                                Rumput
                            </h2>

                            <button type="button"
                                    class="btn btn-secondary rounded-pill px-5"
                                    onclick="tampilkanKategori('rumput')">

                                Lihat Produk

                            </button>

                        </div>
                    </div>

                    <!-- TANAMAN -->
                    <div class="card shadow-sm border text-center mb-3">
                        <div class="card-body p-3">

                            <h2 class="fs-3 fw-bold mb-3">
                                Tanaman
                            </h2>

                            <button type="button"
                                    class="btn btn-secondary rounded-pill px-5"
                                    onclick="tampilkanKategori('tanaman')">

                                Lihat Produk

                            </button>

                        </div>
                    </div>

                    <!-- BUNGA -->
                    <div class="card shadow-sm border text-center mb-3">
                        <div class="card-body p-3">

                            <h2 class="fs-3 fw-bold mb-3">
                                Bunga
                            </h2>

                            <button type="button"
                                    class="btn btn-secondary rounded-pill px-5"
                                    onclick="tampilkanKategori('bunga')">

                                Lihat Produk

                            </button>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </section>


    <!-- MODAL DAFTAR PRODUK -->
    <div class="modal fade"
         id="modalProduk"
         tabindex="-1"
         aria-labelledby="modalProdukLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header">

                    <h2 class="modal-title fw-bold"
                        id="modalProdukLabel">
                        Produk
                    </h2>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>

                <!-- Isi Produk -->
                <div class="modal-body p-3">
                    <div id="daftarProduk"></div>
                </div>

            </div>
        </div>

    </div>


    <!-- MODAL DETAIL PRODUK -->
    <div class="modal fade"
         id="modalDetail"
         tabindex="-1"
         aria-labelledby="modalDetailLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header py-3">

                    <h2 class="modal-title fw-bold"
                        id="modalDetailLabel">
                        Detail Produk
                    </h2>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>

                <!-- Isi Detail -->
                <div class="modal-body p-3">

                    <div class="row align-items-center g-3">

                        <!-- Foto Produk -->
                        <div class="col-md-6">

                            <button type="button"
                                    class="btn p-0 border-0 w-100"
                                    onclick="bukaGaleri()">

                                <div class="ratio ratio-16x9">

                                    <img id="fotoProduk"
                                         src=""
                                         class="w-100 h-100 object-fit-cover rounded shadow-sm"
                                         alt="Foto Produk">

                                </div>

                            </button>

                        </div>

                        <!-- Informasi Produk -->
                        <div class="col-md-6">

                            <h3 id="namaProduk"
                                class="fs-3 fw-bold mb-3">
                            </h3>

                            <p class="text-secondary mb-1">
                                Harga
                            </p>

                            <h4 id="hargaProduk"
                                class="fs-5 fw-bold text-break mb-0">
                            </h4>

                        </div>

                    </div>

                </div>

            </div>
        </div>

    </div>


    <!-- MODAL GALERI / CAROUSEL -->
    <div class="modal fade"
         id="modalGaleri"
         tabindex="-1"
         aria-labelledby="modalGaleriLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header py-3">

                    <h2 class="modal-title fw-bold"
                        id="modalGaleriLabel">
                        Galeri Produk
                    </h2>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>

                <!-- Carousel -->
                <div class="modal-body p-3">

                    <div id="carouselProduk"
                         class="carousel slide">

                        <div class="carousel-inner rounded"
                             id="isiCarousel">
                        </div>

                        <!-- Tombol Sebelumnya -->
                        <button class="carousel-control-prev"
                                type="button"
                                data-bs-target="#carouselProduk"
                                data-bs-slide="prev">

                            <span class="carousel-control-prev-icon"></span>

                            <span class="visually-hidden">
                                Sebelumnya
                            </span>

                        </button>

                        <!-- Tombol Berikutnya -->
                        <button class="carousel-control-next"
                                type="button"
                                data-bs-target="#carouselProduk"
                                data-bs-slide="next">

                            <span class="carousel-control-next-icon"></span>

                            <span class="visually-hidden">
                                Berikutnya
                            </span>

                        </button>

                    </div>

                </div>

            </div>
        </div>

    </div>


    <!-- FOOTER -->
    <footer class="bg-secondary py-3">

        <div class="container text-center text-white">

            <p class="mb-1 fw-bold">
                UCCANK'S LANDSCAPE
            </p>

            <p class="mb-2 text-white-50">
                Jasa Pembuatan Taman & Kolam
            </p>

            <hr>

            <small class="text-white-50">
                © 2026 UCCANK'S LANDSCAPE
            </small>

        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script>

        /* DATA PRODUK */

        const produk = {

            /* ---------- RUMPUT ---------- */

            rumput: [

                {
                    nama: "Rumput Gajah Mini",
                    harga: "Rp.25.000/meter",
                    foto: [
                        "gambar/rumput1-1.jpg",
                        "gambar/rumput1-2.jpg",
                        "gambar/rumput1-3.jpg"
                    ]
                },

                {
                    nama: "Rumput Jepang",
                    harga: "Rp.25.000/meter",
                    foto: [
                        "gambar/rumput2-1.jpg",
                        "gambar/rumput2-2.jpg",
                        "gambar/rumput2-3.jpg"
                    ]
                },

                {
                    nama: "Rumput Swiss",
                    harga: "Rp.30.000/meter",
                    foto: [
                        "gambar/rumput4-1.jpg",
                        "gambar/rumput4-2.jpg",
                        "gambar/rumput4-3.jpg"
                    ]
                }

            ],

            /* ---------- TANAMAN ---------- */

            tanaman: [

                {
                    nama: "Cemara Udang",
                    harga: "Rp.1.500.000-Rp.2.500.000/pohon",
                    foto: [
                        "gambar/tanaman1-1.jpg",
                        "gambar/tanaman1-2.jpg",
                        "gambar/tanaman1-3.jpg"
                    ]
                },

                {
                    nama: "Beringin Dollar",
                    harga: "Rp.2.000.000-Rp.2.500.000/pohon",
                    foto: [
                        "gambar/tanaman2-1.jpg",
                        "gambar/tanaman2-2.jpg",
                        "gambar/tanaman2-3.jpg"
                    ]
                },

                {
                    nama: "Sikas",
                    harga: "Rp.1.500.000-Rp.3.500.000/pohon",
                    foto: [
                        "gambar/tanaman5-1.jpg",
                        "gambar/tanaman5-2.jpg",
                        "gambar/tanaman5-3.jpg"
                    ]
                }

            ],

            /* ---------- BUNGA ---------- */

            bunga: [

                {
                    nama: "Aglonema",
                    harga: "Rp.50.000-Rp.150.000/pohon",
                    foto: [
                        "gambar/bunga1-1.jpg",
                        "gambar/bunga1-2.jpg",
                        "gambar/bunga1-3.jpg"
                    ]
                },

                {
                    nama: "Agave",
                    harga: "Rp.30.000-Rp.150.000/pohon",
                    foto: [
                        "gambar/bunga2-1.jpg",
                        "gambar/bunga2-2.jpg",
                        "gambar/bunga2-3.jpg"
                    ]
                },

                {
                    nama: "Lidah Mertua",
                    harga: "Rp.7.500-Rp.25.000/pohon",
                    foto: [
                        "gambar/bunga3-1.jpg",
                        "gambar/bunga3-2.jpg",
                        "gambar/bunga3-3.jpg"
                    ]
                }

            ]

        };


        /* Produk yang sedang dipilih */

        let produkDipilih = null;


        /* TAMPILKAN KATEGORI */

        function tampilkanKategori(kategori) {

            const daftar =
                document.getElementById("daftarProduk");

            const judul =
                document.getElementById("modalProdukLabel");

            judul.textContent =
                kategori.charAt(0).toUpperCase() +
                kategori.slice(1);

            daftar.innerHTML = "";

            produk[kategori].forEach(function(item, index) {

                const card =
                    document.createElement("div");

                card.className =
                    "card mb-3 shadow-sm border";

                card.innerHTML = `

                    <div class="card-body p-3">

                        <div class="row align-items-center">

                            <div class="col-md-8">

                                <h3 class="fs-4 fw-bold mb-2">
                                    ${item.nama}
                                </h3>

                                <p class="fw-semibold text-secondary mb-0">
                                    ${item.harga}
                                </p>

                            </div>

                            <div class="col-md-4 text-md-end mt-2 mt-md-0">

                                <button type="button"
                                        class="btn btn-secondary px-4"
                                        onclick="tampilkanDetail('${kategori}', ${index})">

                                    Lihat Detail

                                </button>

                            </div>

                        </div>

                    </div>

                `;

                daftar.appendChild(card);

            });

            const modal =
                new bootstrap.Modal(
                    document.getElementById("modalProduk")
                );

            modal.show();

        }


        /* TAMPILKAN DETAIL */

        function tampilkanDetail(kategori, index) {

            produkDipilih =
                produk[kategori][index];

            document.getElementById("namaProduk").textContent =
                produkDipilih.nama;

            document.getElementById("hargaProduk").textContent =
                produkDipilih.harga;

            document.getElementById("fotoProduk").src =
                produkDipilih.foto[0];

            document.getElementById("fotoProduk").alt =
                produkDipilih.nama;

            const modalDetail =
                new bootstrap.Modal(
                    document.getElementById("modalDetail")
                );

            modalDetail.show();

        }


        /* BUKA GALERI */

        function bukaGaleri() {

            if (!produkDipilih) {
                return;
            }

            const carousel =
                document.getElementById("isiCarousel");

            carousel.innerHTML = "";

            produkDipilih.foto.forEach(function(foto, index) {

                const item =
                    document.createElement("div");

                item.className =
                    index === 0
                    ? "carousel-item active"
                    : "carousel-item";

                item.innerHTML = `

                    <div class="ratio ratio-16x9">

                        <img src="${foto}"
                             class="w-100 h-100 object-fit-cover"
                             alt="${produkDipilih.nama}">

                    </div>

                `;

                carousel.appendChild(item);

            });

            document.getElementById("modalGaleriLabel").textContent =
                produkDipilih.nama;

            const modalGaleri =
                new bootstrap.Modal(
                    document.getElementById("modalGaleri")
                );

            modalGaleri.show();

        }

    </script>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
